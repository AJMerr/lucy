# Sprite pack manifest. See docs/adr/0005-sprite-tauri-and-packs.md.
#
# To make your own pack, copy this folder to <data dir>/lucy/packs/<name>/
# (Linux: ~/.local/share/lucy/packs/<name>/), replace the frames, and set
# `[sprite] pack = "<name>"` in config.toml.

name = "Placeholder"
author = "Lucy project"
format_version = 1
kind = "frames"            # "frames" now; "live2d" planned
size = [128, 128]          # native frame size in px; scaled by `[sprite] scale`
anchor = "bottom-center"   # point that stays fixed on screen when scaling

# Required states: idle, thinking, talking.
# Optional states fall back to idle: happy, error, listening.

[states.idle]
frames = ["frames/idle-0.png", "frames/idle-0.png", "frames/idle-0.png", "frames/idle-1.png"]
fps = 2

[states.thinking]
frames = ["frames/thinking-0.png", "frames/thinking-1.png", "frames/thinking-2.png"]
fps = 3

[states.talking]
frames = ["frames/talking-0.png", "frames/talking-1.png"]
fps = 6

[states.happy]
frames = ["frames/happy-0.png"]
fps = 1
loop = false
then = "idle"              # state to return to when a non-looping state ends

[states.error]
frames = ["frames/error-0.png"]
fps = 1
loop = false
then = "idle"
