name: An idea
description: Something Lucy could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and how you'd like it to work. Start from the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: What you do now
      description: How you get by without it, if at all.
