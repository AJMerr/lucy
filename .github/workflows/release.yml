name: Release bundles

# When a release is published (or by hand, for an existing release), build the sprite's
# installers with `lucy` inside and attach them to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the bundles to (e.g. v0.4.0); empty builds this branch and keeps them as run artifacts
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the .deb and AppImage run on older systems too.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/sprite/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/sprite/src-tauri
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
          libgtk-layer-shell-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev libfuse2

      # `lucy` goes in every bundle, next to `lucy-sprite` (a Tauri sidecar named for the
      # target).
      - name: Build lucy
        shell: bash
        run: |
          cargo build --release -p lucy-cli
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p apps/sprite/src-tauri/binaries
          cp "target/release/lucy$ext" "apps/sprite/src-tauri/binaries/lucy-$triple$ext"

      - name: Build the bundles
        working-directory: apps/sprite
        shell: bash
        run: |
          npm --prefix ../ui ci
          npm ci
          npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - name: Attach them to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/sprite/src-tauri/target/release/bundle
          files=()
          for file in deb/*.deb rpm/*.rpm appimage/*.AppImage dmg/*.dmg msi/*.msi; do
            [ -f "$file" ] || continue
            # No spaces in asset names ("Lucy Sprite_0.4.0_amd64.deb" -> "lucy-sprite_0.4.0_amd64.deb").
            named="$(dirname "$file")/$(basename "$file" | sed 's/^Lucy Sprite/lucy-sprite/')"
            [ "$file" = "$named" ] || mv "$file" "$named"
            files+=("$named")
          done
          echo "Attaching: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # A trial run (no tag): keep them with the run instead.
      - if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: apps/sprite/src-tauri/target/release/bundle/*/*.*
