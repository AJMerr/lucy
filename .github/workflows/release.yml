name: Release bundles

# When a release is published (or by hand, for an existing release), build the sprite's
# installers with `lucy` inside and attach them to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the bundles to (e.g. v0.4.0); empty builds this branch and keeps them as run artifacts
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu, so the .deb and AppImage run on older systems too.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: app,dmg
          - os: windows-latest
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            apps/ui/package-lock.json
            apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/desktop/src-tauri
      - if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev
          libgtk-layer-shell-dev librsvg2-dev libsoup-3.0-dev libayatana-appindicator3-dev libfuse2

      # `lucy` goes in every bundle, next to `lucy-desktop` (a Tauri sidecar named for the
      # target).
      - name: Build lucy
        shell: bash
        run: |
          cargo build --release -p lucy-cli
          triple=$(rustc -vV | sed -n 's/^host: //p')
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/release/lucy$ext" "apps/desktop/src-tauri/binaries/lucy-$triple$ext"

      - name: Build the bundles
        working-directory: apps/desktop
        shell: bash
        run: |
          npm --prefix ../ui ci
          npm ci
          npm run tauri -- build --config src-tauri/tauri.bundle.conf.json --bundles ${{ matrix.bundles }}

      - name: Attach them to the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd apps/desktop/src-tauri/target/release/bundle
          files=()
          for file in deb/*.deb rpm/*.rpm appimage/*.AppImage dmg/*.dmg msi/*.msi; do
            [ -f "$file" ] || continue
            files+=("$file")
          done
          echo "Attaching: ${files[*]}"
          gh release upload "$TAG" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"

      # A trial run (no tag): keep them with the run instead.
      - if: env.TAG == ''
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: apps/desktop/src-tauri/target/release/bundle/*/*.*

  # The Homebrew tap (formula and cask) and the AUR's lucy-bin, filled in from the files just
  # attached. A pre-release, or a run by hand, only renders them and keeps them with the run (a
  # dry run); a release pushes them, once the repo has the HOMEBREW_TAP_TOKEN (a token that can
  # push to AJMerr/homebrew-lucy) and AUR_SSH_KEY (the AUR account's private key) secrets.
  packages:
    needs: bundle
    if: github.event.release.tag_name || inputs.tag
    runs-on: ubuntu-latest
    env:
      PUBLISH: ${{ github.event_name == 'release' && !github.event.release.prerelease }}
    steps:
      # The templates come from the workflow's own ref (the tag, for a release); the files
      # they describe come from the release.
      - uses: actions/checkout@v4
      - name: Fill in the packages
        run: packaging/render.sh "${TAG#v}" packages
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages
          include-hidden-files: true

      - name: Update the Homebrew tap
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ "$PUBLISH" != true ] || [ -z "$TOKEN" ]; then
            echo "Not publishing (dry run, or no HOMEBREW_TAP_TOKEN secret)."; exit 0
          fi
          git clone --depth 1 "https://x-access-token:$TOKEN@github.com/AJMerr/homebrew-lucy.git" tap
          mkdir -p tap/Formula tap/Casks
          cp packages/homebrew/Formula/lucy.rb tap/Formula/
          cp packages/homebrew/Casks/lucy.rb tap/Casks/
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "lucy ${TAG#v}"
          git push

      - name: Update the AUR package
        env:
          KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          if [ "$PUBLISH" != true ] || [ -z "$KEY" ]; then
            echo "Not publishing (dry run, or no AUR_SSH_KEY secret)."; exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o IdentitiesOnly=yes"
          git clone ssh://aur@aur.archlinux.org/lucy-bin.git aur
          cp packages/aur/PKGBUILD packages/aur/.SRCINFO aur/
          cd aur
          git config user.name "AJMerr"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "lucy-bin ${TAG#v}"
          git push
