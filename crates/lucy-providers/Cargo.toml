[package]
name = "lucy-providers"
description = "Model-agnostic Provider trait and adapters (mock, OpenAI-compatible, Anthropic)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fake HTTP server for adapter tests, shared with other crates' tests.
testing = ["dep:tokio"]

[dependencies]
lucy-protocol.workspace = true
async-trait.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, optional = true, features = ["net", "io-util", "time"] }

[dev-dependencies]
lucy-providers = { path = ".", features = ["testing"] }
tokio.workspace = true
