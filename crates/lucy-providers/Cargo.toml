[package]
name = "lucy-providers"
description = "Model-agnostic Provider trait and adapters (mock, OpenAI-compatible, Anthropic)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Fake HTTP server for adapter tests, shared with other crates' tests.
testing = ["tokio/net", "tokio/io-util"]

[dependencies]
lucy-protocol.workspace = true
async-trait.workspace = true
base64.workspace = true
futures.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
lucy-providers = { path = ".", features = ["testing"] }
tokio.workspace = true
