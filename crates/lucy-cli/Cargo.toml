[package]
name = "lucy-cli"
description = "The `lucy` command: interactive chat, one-shot ask, auth, and service management."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "lucy_cli"
path = "src/lib.rs"

[[bin]]
name = "lucy"
path = "src/main.rs"

[dependencies]
lucy-core.workspace = true
anyhow.workspace = true
clap.workspace = true
chrono.workspace = true
dialoguer.workspace = true
serde.workspace = true
serde_json.workspace = true
rustyline.workspace = true
syntect.workspace = true
terminal_size.workspace = true
lucy-client.workspace = true
lucy-protocol.workspace = true
lucy-tools.workspace = true
shell-words.workspace = true
toml_edit.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
lucy-providers = { workspace = true, features = ["testing"] }
tempfile.workspace = true
