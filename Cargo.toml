[workspace]
resolver = "3"
members = [
    "crates/lucy-protocol",
    "crates/lucy-providers",
    "crates/lucy-core",
    "crates/lucy-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
lucy-protocol = { path = "crates/lucy-protocol" }
lucy-providers = { path = "crates/lucy-providers" }
lucy-core = { path = "crates/lucy-core" }

anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
