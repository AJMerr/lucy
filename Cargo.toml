[workspace]
resolver = "3"
members = [
    "crates/lucy-protocol",
    "crates/lucy-providers",
    "crates/lucy-client",
    "crates/lucy-core",
    "crates/lucy-cli",
    "crates/lucy-tools",
    "crates/lucy-packs",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
lucy-protocol = { path = "crates/lucy-protocol" }
lucy-providers = { path = "crates/lucy-providers" }
lucy-core = { path = "crates/lucy-core" }
lucy-client = { path = "crates/lucy-client" }
lucy-tools = { path = "crates/lucy-tools" }
lucy-packs = { path = "crates/lucy-packs" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
getrandom = "0.2"
dirs = "7"
futures = "0.3"
globset = "0.4"
ignore = "0.4"
interprocess = { version = "2.4", features = ["tokio"] }
keyring = "4.2"
libc = "0.2"
regex = "1"
notify-rust = "4"
reqwest = { version = "0.13", features = ["json", "stream"] }
rmcp = { version = "3.9", features = ["client", "server", "macros", "schemars", "transport-io", "transport-child-process", "which-command", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
rusqlite = { version = "0.41", features = ["bundled"] }
rustyline = { version = "19", features = ["derive"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
similar = "3"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
tempfile = "3"
terminal_size = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "signal", "net"] }
tokio-util = "0.7"
toml = "1.2"
toml_edit = "0.25"
ulid = "3"
base64 = "0.22"
sha2 = "0.10"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_Threading"] }
widestring = "1.2"
