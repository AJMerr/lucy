[workspace]
resolver = "3"
members = [
    "crates/lucy-protocol",
    "crates/lucy-providers",
    "crates/lucy-client",
    "crates/lucy-core",
    "crates/lucy-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
lucy-protocol = { path = "crates/lucy-protocol" }
lucy-providers = { path = "crates/lucy-providers" }
lucy-core = { path = "crates/lucy-core" }
lucy-client = { path = "crates/lucy-client" }

anyhow = "1"
async-trait = "0.1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.12"
dirs = "7"
futures = "0.3"
interprocess = { version = "2.4", features = ["tokio"] }
keyring = "4.2"
reqwest = { version = "0.13", features = ["json", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "signal"] }
tokio-util = "0.7"
toml = "1.2"
ulid = "3"
