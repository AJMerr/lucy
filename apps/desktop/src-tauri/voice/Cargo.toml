[package]
name = "lucy-voice"
version = "1.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Lucy's voice: hearing (Whisper), speaking (Kokoro, Piper, hosted) and her wake word, on sherpa-onnx loaded at run time"
publish = false

[dependencies]
bzip2 = "0.6"
cpal = "0.15"
futures-util = "0.3"
libloading = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "fs", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
