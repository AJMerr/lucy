[package]
name = "lucy-desktop"
description = "Lucy's desktop app: her sprite, her main window (chats and settings) and a tray icon."
version = "1.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

# A workspace of its own: building it needs WebKitGTK and friends (see the flake's dev shell),
# which the main workspace's crates and tests don't.
[workspace]
members = ["voice"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lucy-core = { path = "../../../crates/lucy-core" }
lucy-packs = { path = "../../../crates/lucy-packs" }
lucy-cli = { path = "../../../crates/lucy-cli" }
lucy-client = { path = "../../../crates/lucy-client" }
lucy-protocol = { path = "../../../crates/lucy-protocol" }
lucy-voice = { path = "voice" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
