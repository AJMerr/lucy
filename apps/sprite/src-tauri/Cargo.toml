[package]
name = "lucy-sprite"
description = "Lucy's desktop sprite: a transparent overlay that shows her sprite pack."
version = "0.3.0"
edition = "2024"
license = "LicenseRef-Proprietary"
publish = false

# A workspace of its own: building it needs WebKitGTK and friends (see the flake's dev shell),
# which the main workspace's crates and tests don't.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
lucy-core = { path = "../../../crates/lucy-core" }
lucy-packs = { path = "../../../crates/lucy-packs" }
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
