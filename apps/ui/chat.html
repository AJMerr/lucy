<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lucy</title>
    <style>
      :root {
        --bg: #12101e;
        --panel: #1c1930;
        --text: #ecebf5;
        --muted: #a6a3bd;
        --accent: #5ee8f2;
        --hot: #ff4fa3;
        --line: rgba(94, 232, 242, 0.25);
        font: 14px/1.45 system-ui, sans-serif;
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
      }
      [hidden] {
        display: none !important;
      }
      #log {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #empty {
        margin: auto;
        color: var(--muted);
      }
      .you {
        align-self: flex-end;
        max-width: 80%;
        padding: 8px 12px;
        background: rgba(94, 232, 242, 0.14);
        border: 1px solid var(--line);
        border-radius: 12px 12px 2px 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .lucy {
        align-self: flex-start;
        max-width: 92%;
        padding: 8px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px 12px 12px 2px;
        overflow-wrap: anywhere;
      }
      .lucy p,
      .lucy ul,
      .lucy ol {
        margin: 0 0 6px;
      }
      .lucy > :last-child {
        margin-bottom: 0;
      }
      .lucy ul,
      .lucy ol {
        padding-left: 20px;
      }
      code {
        font: 12.5px ui-monospace, monospace;
        background: rgba(255, 255, 255, 0.08);
        padding: 0 3px;
        border-radius: 3px;
      }
      pre {
        font: 12.5px ui-monospace, monospace;
        background: rgba(0, 0, 0, 0.35);
        padding: 8px;
        border-radius: 6px;
        overflow-x: auto;
        margin: 6px 0;
      }
      pre code {
        background: none;
        padding: 0;
      }
      .error {
        color: var(--hot);
      }
      .note {
        color: var(--muted);
        font-size: 12px;
      }
      .tool {
        align-self: flex-start;
        color: var(--muted);
        font-size: 13px;
      }
      .tool.failed .state {
        color: var(--hot);
      }
      .tool.asking {
        color: var(--text);
        padding: 8px 12px;
        border: 1px solid var(--hot);
        border-radius: 10px;
        max-width: 92%;
      }
      .tool .reason {
        color: var(--muted);
        font-size: 12px;
      }
      .buttons {
        display: flex;
        gap: 6px;
        margin-top: 6px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 3px 10px;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #10101a;
        border-color: var(--accent);
      }
      button.link {
        background: none;
        border: none;
        color: var(--accent);
        padding: 3px 4px;
      }
      #thinking {
        align-self: flex-start;
        color: var(--muted);
      }
      #ask {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line);
        background: var(--panel);
      }
      #ask textarea {
        flex: 1;
        resize: none;
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 7px 10px;
        max-height: 30vh;
      }
      #ask textarea:focus {
        outline: 1px solid var(--accent);
      }
    </style>
  </head>
  <body>
    <main id="log">
      <div id="empty">Her chat is empty. Say hi.</div>
    </main>
    <form id="ask">
      <textarea rows="1" placeholder="Message Lucy… (Enter sends, Shift+Enter for a new line)"></textarea>
      <button id="stop" type="button" hidden>Stop</button>
      <button class="primary" type="submit">Send</button>
    </form>
    <script type="module" src="/src/sprite/chat-window.ts"></script>
  </body>
</html>
