# Example Lucy config. Copy to your config dir:
#   Linux:   ~/.config/lucy/config.toml
#   macOS:   ~/Library/Application Support/lucy/config.toml
#   Windows: %APPDATA%\lucy\config.toml
#
# `lucy` runs a first-run wizard that writes this for you; this file documents the format.
# API keys never go here — use `lucy auth set <key_name>` (OS keyring) or the env var override.

[defaults]
profile = "local-qwen"          # used by Assist mode and `lucy ask`
agent_profile = "claude"        # used by Agent mode (optional; falls back to `profile`)
persona = "lucy"                # persona/<name>.md
mode = "assist"                 # "assist" | "agent"
agent_level = 1                 # 0 supervised, 1 guarded, 2 workspace, 3 unrestricted

[agent]                         # `/mode agent` in a chat, or `lucy agent "task"`
max_steps = 25                  # model steps per task; then Lucy sums up and stops
max_cost_usd = 1.00             # for profiles with prices (local models are free)
max_tokens = 1000000            # instead of cost, for profiles without prices
workspace = "~/Projects"        # agent_level 2 runs anything local in here (default: the
                                # folder you started in)

# --- Provider profiles -------------------------------------------------------------------

[profiles.local-qwen]
provider = "openai_compat"
base_url = "http://localhost:11434/v1"   # Ollama
model = "qwen3:14b"
# tools = false                 # for models that can't call tools

[profiles.qwen-cloud]
provider = "openai_compat"
base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
model = "qwen-max"
key_name = "dashscope"          # keyring entry; env override: LUCY_KEY_DASHSCOPE

[profiles.openrouter]
provider = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-235b-a22b"
key_name = "openrouter"

[profiles.claude]
provider = "anthropic"
model = "claude-sonnet-5-5"
key_name = "anthropic"          # env override: LUCY_KEY_ANTHROPIC (or ANTHROPIC_API_KEY)
price_in = 3.00                 # USD per million tokens, for agent cost caps
price_out = 15.00

# --- Tools (Assist mode) ------------------------------------------------------------------
# Read-only tools run by themselves for files in your home folder. Anything that changes
# files, runs commands or goes online asks first: y (once), a (always, this chat), n (no).

[tools]
builtin = true                  # Lucy's own tools: read_file, list_dir, search_files,
                                # fetch_url, run_command, write_file, edit_file
max_rounds = 10                 # tool rounds per message before Lucy must answer
# Never read without asking. `~/` is your home; `**/` matches anywhere. Setting this replaces
# the built-in list, so copy the defaults you want to keep:
# private_paths = ["~/.ssh/**", "~/.gnupg/**", "~/.aws/**", "**/.env", "**/*.pem", "**/*.key"]

[tools.rules]                   # override the usual rule for a tool: "auto" | "ask" | "deny"
# run_command = "deny"
# github = "ask"               # every tool from the `github` MCP server
# fetch_url = "auto"

# --- External MCP servers -----------------------------------------------------------------
# Programs Lucy starts, or URLs she connects to, the first time a chat needs tools; then kept
# for every chat. Their tools appear as `<server>__<tool>` and follow the same rules as the
# built-ins (labels decide what runs by itself; [tools.rules] can name a whole server, e.g.
# github = "ask"). Remote servers' read-only tools run without local path checks.
# `lucy mcp add|list|remove|login|logout` manage this section for you.

[mcp.servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
env_keys = { GITHUB_PERSONAL_ACCESS_TOKEN = "github" }   # from `lucy auth set github`
# env = { GITHUB_HOST = "github.com" }                  # plain, non-secret values
# cwd = "~/Projects"                                     # default: home
# enabled = false                                        # keep it configured but off

# A remote server, reached at a URL. Sign in with `lucy mcp login linear` (OAuth, opens your
# browser; tokens go in the keyring), or give it a key:
[mcp.servers.linear]
url = "https://mcp.linear.app/mcp"
# bearer_key = "linear"                                  # sends `Authorization: Bearer <key>`
# header_keys = { X-Api-Key = "acme" }                   # other headers, filled from the keyring
# headers = { X-Region = "eu" }                          # plain headers
# oauth_client_id = "your-app-id"                        # if the server won't register Lucy itself
# oauth_redirect_port = 8976                             # if that app needs a fixed redirect

# --- Remote access (off by default) -------------------------------------------------------
# Lets `lucy` on other machines use this core over WebSocket (ws://<bind>/rpc). Each needs the
# token from `lucy remote token`. Restart the core after changing this section
# (`lucy service restart`, or `lucy core stop`).

[remote]
enabled = false
bind = "127.0.0.1:7077"         # e.g. "100.64.0.7:7077" for your Tailscale address
# allow_network = true          # needed for any bind beyond 127.0.0.1; there's no TLS, so only
                                # on networks you trust (Tailscale) or behind a TLS proxy
# max_level = 1                 # highest agent level for chats from other machines (0-3)

# --- Sprite (milestone 2) -----------------------------------------------------------------

[sprite]
pack = "placeholder"            # looked up in <data dir>/lucy/packs/, then bundled packs
scale = 1.0
bubble_timeout_secs = 12

# --- You ----------------------------------------------------------------------------------

[user]
name = "Sam"                    # optional: what Lucy calls you
